# Verification automatique : rejoue le build et les controles sur chaque PR et chaque push sur main.
# Le job s'appelle « verify » : c'est le controle exige avant fusion (voir docs/ENRICHISSEMENT.md).
# Non rejoue ici : scripts/capture_reference.py --check (captures pixel par pixel, dependantes des
# polices de la machine : a lancer en local apres un changement d'interface).
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright et Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build reproductible (index.html, sw.js et data/ = resultat du build)
        run: python src/build.py --check
      - name: Preflight
        run: python scripts/preflight.py
      - name: Format des donnees
        run: python scripts/validate_data.py
      - name: Tests des outils de verification
        run: python scripts/test_ci_tools.py
      - name: Reproductibilite du build
        run: python scripts/test_build.py
      - name: Tests de regression
        run: python scripts/test_regression.py
      - name: Accessibilite (titres, reperes, noms, cibles, texte, contraste)
        run: python scripts/audit_a11y.py
      - name: Accessibilite en mode sombre
        run: python scripts/audit_a11y.py --dark
      - name: Couleurs hors jetons (ne doit pas augmenter)
        run: python scripts/audit_tokens.py
